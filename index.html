<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Study Planner</title>
<style>
:root{--bg:#0f1117;--card:#181b24;--text:#e8eaf0;--muted:#9aa1b5;--line:#2a2f3e;--accent:#7aa2ff;--danger:#ff6b6b;}
@media (prefers-color-scheme: light){:root{--bg:#f4f5f9;--card:#ffffff;--text:#1c2030;--muted:#5d6478;--line:#e2e5ef;}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:36px 32px;max-width:360px;width:100%;text-align:center}
.box .e{font-size:2.4rem}
h1{font-size:1.2rem;margin:10px 0 4px}
p{color:var(--muted);font-size:.9rem;margin-bottom:20px}
input{width:100%;padding:12px;font-size:1.4rem;text-align:center;letter-spacing:.5em;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);outline:none}
input:focus{border-color:var(--accent)}
button{margin-top:14px;width:100%;padding:12px;font-size:1rem;font-weight:600;border:none;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--danger);font-size:.85rem;margin-top:10px;min-height:1.2em}
</style>
</head>
<body>
<div class="box">
<div class="e">🔒📚</div>
<h1>My Study Planner</h1>
<p>Enter your PIN to open</p>
<input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="12" autofocus>
<button id="go">Open</button>
<div class="err" id="err"></div>
</div>

const b2a = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));
async function open(){
  const err = document.getElementById('err');
  const btn = document.getElementById('go');
  const pin = (document.getElementById('pin').value || '').trim();
  if(!pin){ err.textContent = 'Please type your PIN.'; return; }
  err.textContent = ''; btn.disabled = true; btn.textContent = 'Opening…';
  try{
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt:b2a(P.salt), iterations:600000, hash:'SHA-256' },
      km, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b2a(P.iv) }, key, b2a(P.ct));
    const html = new TextDecoder().decode(pt);
    document.open(); document.write(html); document.close();
  }catch(e){
    btn.disabled = false; btn.textContent = 'Open';
    err.textContent = 'Wrong PIN — try again.';
  }
}
document.getElementById('go').addEventListener('click', open);
document.getElementById('pin').addEventListener('keydown', e => { if(e.key === 'Enter') open(); });
